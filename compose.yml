services:
  # 1.Redis
  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2.PostgreSQL Database service
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 131205
      POSTGRES_DB: postgres 
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data 
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3.Label Studio service
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ตั้งค่าเชื่อมต่อใช้งาน Label Studio กับ PostgreSQL
      DJANGO_DB: default
      POSTGRE_NAME: postgres
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: 131205
      POSTGRE_PORT: 5432
      POSTGRE_HOST: postgres 
    depends_on:
      - postgres 
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4.MinIO Service
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  postgresql-data:
  minio-data: